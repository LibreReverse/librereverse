name: Product checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run synthetic media integration tests on the hosted Mac
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source tree hygiene
        run: python3 scripts/check_source_tree.py
      - name: Install build dependencies
        run: brew install sqlcipher pkg-config
      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          brew list --versions
      - name: Product and script tests
        run: scripts/test.sh unit
      - name: Prepare native speech processor for integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.integration
        run: python3 scripts/prepare_speech_runtime.py
      - name: Synthetic media integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.integration
        run: scripts/test.sh integration
